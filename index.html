 card.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const x=e.clientX-drag.x,y=e.clientY-drag.y;if(Math.abs(x)>Math.abs(y)&&Math.abs(x)>8){card.style.transform=`translateX(${x}px) translateY(${Math.abs(x)*.04}px) rotate(${Math.max(-18,Math.min(18,x/16))}deg)`;const label=$('drag-label'),choice=x<0?'A':'B';card.dataset.direction=choice;label.dataset.choice=choice;label.style.opacity=Math.min(Math.abs(x)/85,1);label.firstElementChild.textContent=choice+' 선택';}});
 card.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const x=e.clientX-drag.x,y=e.clientY-drag.y,selected=Math.abs(x)>=65&&Math.abs(x)>Math.abs(y)*1.25;if(selected){drag=null;choose(x<0?'A':'B');}else clear();});
 card.addEventListener('pointercancel',clear);
 card.addEventListener('lostpointercapture',()=>{if(drag)clear();});
}
function renderHistory(){const entries=Object.entries(state.votes).sort((a,b)=>b[1].at-a[1].at);$('main').innerHTML=`<h1 class="page-title">내가 고른 쪽.</h1><p class="subtext">작은 선택들이 쌓인 나만의 기록이에요.</p><div class="history-summary"><strong>${entries.length}</strong><span>번의 선택 · ${fmt(earnedPoints())}P 적립</span></div>${entries.length?entries.map(([id,v])=>{const q=QUESTIONS.find(x=>x.id===id);return `<button class="history-card" data-review="${id}"><span class="topic">${q.topic}</span><h3>${q.title.replace('\n',' ')}</h3><div class="history-pick"><span>${v.choice}. ${q[v.choice][0]}<br>${q[v.choice][1]}</span><small>결과 다시 보기 ›</small></div></button>`;}).join(''):`<div class="empty"><div class="empty-illustration">A/B</div><h2>아직 첫 선택 전이에요</h2><p>정답은 없어요.<br>마음 가는 쪽으로 한 번 골라보세요.</p><button class="primary" data-view="feed">첫 비교 시작하기</button></div>`}`;}
function renderLeaderboard(){
 if(SERVER&&!serverRanks){$('main').innerHTML='<h1 class="page-title">누가 가장 많이 모았을까?</h1><p class="subtext">순위를 불러오고 있어요.</p>';return;}
 const mine=earnedPoints(),rows=SERVER?serverRanks.rows:[...LEADERBOARD_SAMPLES.map(([name,points])=>({name,points})),{name:'나',points:mine,me:true}].sort((a,b)=>b.points-a.points);
 const myRank=SERVER?serverRanks.myRank:rows.findIndex(r=>r.points===mine)+1;
 $('main').innerHTML=`<h1 class="page-title">누가 가장 많이 모았을까?</h1><p class="subtext">선택으로 쌓은 포인트를 한눈에 비교해요.</p><div class="ranking-note">${SERVER?(serverRanks.demoCount?`예시 참여자 ${fmt(serverRanks.demoCount)}명 포함`:'누적 적립 순위'):'예시 참여자 포함'}</div><section class="rank-summary"><div><span>내 누적 적립</span><strong id="rank-earned">${fmt(mine)} <small>P</small></strong></div><div class="my-rank"><strong id="my-rank">${myRank}<small>위</small></strong><span>${SERVER?'이 서버 참여자 기준':'예시 순위표 기준'}</span></div></section><p class="rank-rule">기본 적립 + 초대 보너스 기준이에요.<br>시작 포인트 1,000P는 제외하고, 출금해도 누적 적립은 유지돼요.</p><div class="rank-columns" aria-hidden="true"><span>순위</span><span>닉네임</span><span>누적 적립</span></div><ol class="rank-list" aria-label="누적 적립 포인트 순위">${rows.map(r=>{const rank=SERVER?r.rank:rows.findIndex(x=>x.points===r.points)+1;return `<li class="rank-row ${r.me?'me':''} ${rank<=3?'top-three':''}" data-points="${r.points}"><span class="rank-number">${rank}<span class="sr-only">위</span></span><div class="rank-person"><strong>${r.name}${r.me?' · 내 기록':''}</strong><small>${r.me?'내 누적 선택 포인트':SERVER?(r.demo?'예시 참여자':'참여자 · 익명'):'예시 이용자'}</small></div><span class="rank-points">${fmt(r.points)} <small>P</small></span></li>`;}).join('')}</ol>`;
}
function timeLabel(at){return new Intl.DateTimeFormat('ko-KR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(at);}
function renderWallet(){const earned=earnedPoints(),withdrawn=state.withdrawals.reduce((s,w)=>s+w.amount,0),records=[...Object.entries(state.votes).map(([id,v])=>({type:'earn',label:QUESTIONS.find(q=>q.id===id).topic+' 선택',amount:v.reward,at:v.at,bonus:v.reward>REWARD})),...state.withdrawals.map(w=>({type:'withdraw',label:'출금 신청',amount:-w.amount,at:w.at,id:w.id}))].sort((a,b)=>b.at-a.at);records.push({type:'welcome',label:'웰컴 포인트',amount:WELCOME,at:null});$('main').innerHTML=`<h1 class="page-title">내 선택이 차곡차곡.</h1><p class="subtext">고르는 즐거움이 포인트로 쌓여요.</p><div class="wallet-hero"><span>사용 가능한 포인트</span><strong id="wallet-balance">${fmt(balance())} <small>P</small></strong><small>선택할 때마다 20P 적립</small><button class="primary" data-action="withdraw" ${balance()<MINIMUM?'disabled':''}>출금 신청 ${icon('arrow-right')}</button>${balance()<MINIMUM?'<p style="margin-top:12px;font-size:11px">500P부터 신청할 수 있어요. 비교를 골라 포인트를 모아보세요.</p>':''}</div>${inviteCard()}<div class="wallet-stats"><div><span>선택으로 모은 포인트</span><strong>${fmt(earned)} P</strong></div><div><span>출금 신청한 포인트</span><strong>${fmt(withdrawn)} P</strong></div></div><h2 class="section-title">포인트 내역 <small>최신순</small></h2><div id="ledger">${records.map(r=>`<div class="ledger-row ${r.amount<0?'debit':''}"><span class="ledger-icon" aria-hidden="true">${r.amount<0?icon('wallet'):'+'}</span><div class="ledger-copy"><strong>${r.label}</strong><small>${r.at?timeLabel(r.at):'BIGYO 첫 방문 선물'}${r.type==='withdraw'?' · 접수됨 · 미지급':r.bonus?' · 초대 보너스 +10P 포함':''}</small></div><span class="ledger-amount">${r.amount>0?'+':'−'}${fmt(Math.abs(r.amount))} P</span></div>`).join('')}</div><div class="notice"><strong>포인트 안내</strong><br>현재 현금 지급은 지원하지 않으며, 출금 신청 내역만 저장됩니다. ${SERVER?'기록은 서버에 저장돼요. 같은 브라우저의 쿠키로 이어 하며, 쿠키를 지우면 이전 기록을 다시 열 수 없어요.':'기록은 이 브라우저에만 저장돼요.'}${!SERVER&&!storageOK?' 현재 브라우저에서는 기록 저장이 안 되어 새로고침하면 초기화될 수 있어요.':''}</div><div class="reset-wrap"><button class="text-btn" data-action="reset">내 기록 초기화</button></div>`;}
function renderWithdraw(){pendingAmount=null;$('main').innerHTML=`<button class="back" data-view="wallet">${icon('arrow-left')}지갑으로</button><h1 class="page-title">얼마를 신청할까요?</h1><p class="subtext">사용 가능한 포인트에서 신청할 금액을 골라 주세요.</p><div class="account-card"><div class="bank-icon">${icon('wallet')}</div><div><strong>출금 신청 접수</strong><small>현재 현금 지급은 지원하지 않아요.</small></div></div><form id="withdraw-form" novalidate><label class="field-label" for="withdraw-amount">신청할 포인트 <span>잔액 ${fmt(balance())}P</span></label><div class="amount-box"><input id="withdraw-amount" type="text" inputmode="numeric" maxlength="8" placeholder="500" value="${Math.min(MINIMUM,balance())}" aria-describedby="withdraw-error amount-hint"><span>P</span></div><div class="amount-presets"><button type="button" data-amount="500">500P</button><button type="button" data-amount="1000">1,000P</button><button type="button" data-amount="all">전액</button></div><p class="subtext" id="amount-hint">최소 500P부터 신청할 수 있어요.</p><p class="error" id="withdraw-error" role="alert"></p><dl class="fee-table"><div class="total"><dt>신청 포인트</dt><dd id="quote-money">500P</dd></div></dl><label class="confirm-check"><input id="withdraw-agree" type="checkbox">신청한 포인트가 잔액에서 차감되며, 아직 현금으로 지급되지 않는다는 점을 확인했어요.</label><button class="primary" type="submit">출금 신청하기</button></form>`;updateQuote();}
function amountValue(){const raw=$('withdraw-amount').value.trim();return /^(\d+|\d{1,3}(,\d{3})+)$/.test(raw)?Number(raw.replaceAll(',','')):NaN;}
function updateQuote(){const n=amountValue(),valid=Number.isSafeInteger(n)&&n>=0;$('quote-money').textContent=valid?fmt(n)+'P':'—';}
function openDialog(title,copy,button,action){dialogOpener=document.activeElement;dialogAction=action;$('dialog-title').textContent=title;$('dialog-copy').textContent=copy;$('dialog-confirm').textContent=button;$('confirm-dialog').showModal();$('dialog-cancel').focus();}
function submitWithdrawal(){const n=amountValue(),input=$('withdraw-amount');let message='';if(!Number.isSafeInteger(n)||n<MINIMUM)message='500P 이상의 정수로 입력해 주세요.';else if(n>balance())message='지금 사용할 수 있는 '+fmt(balance())+'P 이내로 입력해 주세요.';else if(!$('withdraw-agree').checked)message='출금 신청 안내를 확인해 주세요.';$('withdraw-error').textContent=message;input.removeAttribute('aria-invalid');if(message){if(!$('withdraw-agree').checked&&Number.isSafeInteger(n)&&n>=MINIMUM&&n<=balance())$('withdraw-agree').focus();else{input.setAttribute('aria-invalid','true');input.focus();}return;}pendingAmount=n;openDialog(fmt(n)+'P를 신청할까요?','신청 내역을 저장하고 포인트 잔액에서 차감합니다. 현재 현금 지급은 지원하지 않아요.','출금 신청',()=>{const amount=pendingAmount;pendingAmount=null;if(!Number.isSafeInteger(amount)||amount<MINIMUM||amount>balance())return;if(SERVER){withdrawOnServer(amount);return;}lastWithdrawal={id:'request-'+Date.now()+'-'+state.withdrawals.length,amount,at:Date.now()};state.withdrawals.push(lastWithdrawal);save();go('done');$('announcement').textContent='출금 신청이 접수됐습니다. 아직 지급되지 않았습니다.';});}
function renderDone(){if(!lastWithdrawal){go('wallet');return;}const w=lastWithdrawal;$('main').innerHTML=`<div class="success-graphic pop-in">${icon('check')}</div><h1 class="success-title">출금 신청이<br>접수됐어요.</h1><p class="success-sub">신청 내역을 저장했어요.<br>아직 현금으로 지급되지는 않았어요.</p><div class="receipt"><div class="receipt-total"><span>신청 포인트</span><strong>${fmt(w.amount)}P</strong></div><div><span>접수 상태</span><strong>접수됨</strong></div><div><span>지급 상태</span><strong>미지급</strong></div><div><span>남은 포인트</span><strong>${fmt(balance())}P</strong></div><div><span>신청 시각</span><strong>${timeLabel(w.at)}</strong></div></div><button class="primary" data-view="wallet">지갑에서 내역 보기</button><button class="text-btn" data-view="feed" style="width:100%;margin-top:10px">다음 비교 이어가기</button>`;}
$('main').addEventListener('click',e=>{const button=e.target.closest('button');if(!button||mutating||(choosing&&view==='feed'))return;if(button.dataset.action==='retry'){boot();return;}if(!ready)return;if(button.dataset.choice){choose(button.dataset.choice);return;}if(button.dataset.review){if(SERVER){reviewOnServer(button.dataset.review);}else{current=button.dataset.review;go('feed');}return;}if(button.dataset.amount){$('withdraw-amount').value=fmt(button.dataset.amount==='all'?balance():Number(button.dataset.amount));$('withdraw-error').textContent='';updateQuote();return;}const action=button.dataset.action;if(action==='invite'){inviteFriend();return;}if(action==='next'){nextQuestion();render();window.scrollTo({top:0,behavior:'instant'});}if(action==='skip'){if(SERVER){serverMutation(()=>api('/api/skip',{question_id:current}),()=>{nextQuestion();render();toast('패스했어요. 포인트는 적립되지 않아요.');});return;}if(current)skipped.add(current);nextQuestion();render();toast('패스했어요. 포인트는 적립되지 않아요.');}if(action==='withdraw'&&balance()>=MINIMUM)go('withdraw');if(action==='reset')openDialog('처음부터 다시 해볼까요?','내 선택과 출금 신청 기록을 지우고 웰컴 포인트 1,000P로 돌아갑니다. 이 작업은 되돌릴 수 없어요.','기록 초기화',()=>{if(SERVER){serverMutation(()=>api('/api/reset',{}),()=>{serverPolls.clear();serverRanks=null;current=null;lastWithdrawal=null;nextQuestion();go('feed');toast('내 기록을 초기화했어요.');});return;}state={votes:{},withdrawals:[],boostUntil:0,order:buildDeck(QUESTIONS),skipped:[]};skipped.clear();current=null;lastWithdrawal=null;save();go('feed');toast('내 기록을 초기화했어요.');});});
document.addEventListener('click',e=>{const button=e.target.closest('[data-view]');if(button)go(button.dataset.view);});
$('main').addEventListener('input',e=>{if(e.target.id==='withdraw-amount'){updateQuote();$('withdraw-error').textContent='';}});
$('main').addEventListener('submit',e=>{if(e.target.id==='withdraw-form'){e.preventDefault();submitWithdrawal();}});
$('header-wallet').addEventListener('click',()=>go('wallet'));$('brand').addEventListener('click',()=>go('feed'));
$('dialog-cancel').addEventListener('click',()=>{$('confirm-dialog').close();dialogAction=null;pendingAmount=null;});
$('dialog-confirm').addEventListener('click',()=>{const action=dialogAction;dialogAction=null;$('confirm-dialog').close();if(action)action();});
$('confirm-dialog').addEventListener('close',()=>{dialogAction=null;if(dialogOpener?.isConnected)dialogOpener.focus();});
document.addEventListener('keydown',e=>{if(!ready||mutating||view!=='feed'||$('confirm-dialog').open||e.target.matches('input,textarea,select')||e.target.closest('.nav')||e.repeat)return;if(['ArrowLeft','ArrowRight'].includes(e.key)&&!state.votes[current]){e.preventDefault();choose(e.key==='ArrowLeft'?'A':'B');}});
window.addEventListener('storage',e=>{if(e.key===KEY)toast('다른 창에서 기록이 바뀌었어요. 새로고침하면 반영돼요.');});
async function api(path,body){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{
  const response=await fetch(path,{method:body===undefined?'GET':'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Bigyo-Client':'web'},...(body===undefined?{}:{body:JSON.stringify(body)}),signal:controller.signal});
  const data=await response.json();
  if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'요청을 처리하지 못했어요. 다시 시도해 주세요.');
  return data;
 }catch(error){if(error instanceof TypeError||error.name==='AbortError')throw new Error('서버 연결을 확인하고 다시 시도해 주세요.');throw error;}
 finally{clearTimeout(timer);}
}
function applyServerState(data){state=data;skipped=new Set(data.skipped);serverOffset=data.serverNow-Date.now();}
async function serverMutation(request,done){
 if(mutating)return;mutating=true;
 try{const data=await request();applyServerState(data.state||data);mutating=false;done(data);}
 catch(error){toast(error.message);}
 finally{mutating=false;}
}
async function loadLeaderboard(){
 serverRanks=null;
 try{serverRanks=await api('/api/leaderboard');if(view==='leaderboard')render();}
 catch(error){if(view==='leaderboard'){$('main').innerHTML='<h1 class="page-title">순위를 불러오지 못했어요.</h1><button class="primary" data-view="leaderboard">다시 불러오기</button>';toast(error.message);}}
}
async function reviewOnServer(id){
 if(mutating)return;mutating=true;
 try{serverPolls.set(id,await api('/api/questions/'+encodeURIComponent(id)+'/result'));mutating=false;current=id;go('feed');}
 catch(error){toast(error.message);}
 finally{mutating=false;}
}
async function withdrawOnServer(amount){
 let pending;try{pending=JSON.parse(sessionStorage.getItem('bigyo-pending-withdrawal'));}catch{}
 if(!pending||pending.amount!==amount)pending={amount,request_id:crypto.randomUUID()};
 try{sessionStorage.setItem('bigyo-pending-withdrawal',JSON.stringify(pending));}catch{}
 await serverMutation(()=>api('/api/withdrawals',pending),data=>{
  try{sessionStorage.removeItem('bigyo-pending-withdrawal');}catch{}
  lastWithdrawal=data.withdrawal;go('done');$('announcement').textContent='출금 신청이 접수됐습니다. 아직 지급되지 않았습니다.';
 });
}
async function boot(){
 if(!SERVER){nextQuestion();render();return;}
 ready=false;$('header-balance').textContent='— P';
 $('main').innerHTML='<div class="empty"><h2>내 기록을 불러오는 중</h2><p>곧 비교를 시작할 수 있어요.</p></div>';
 try{applyServerState(await api('/api/session'+(new URLSearchParams(location.search).get('ref')?'?ref='+encodeURIComponent(new URLSearchParams(location.search).get('ref')):''),{}));clearTimeout(toastTimer);$('toast').classList.remove('visible');ready=true;view='feed';nextQuestion();render();}
 catch(error){$('main').innerHTML='<div class="empty"><h2>서버에 연결하지 못했어요</h2><p>연결 후 다시 시도해 주세요.</p><button class="primary" data-action="retry">다시 연결하기</button></div>';toast(error.message);}
}
boot();
setInterval(updateBoostUI,1000);
async function refreshServerState(){
 if(!SERVER||!ready||choosing||mutating||document.hidden)return;
 const revision=state.serverNow;
 try{const data=await api('/api/state');if(choosing||mutating||state.serverNow!==revision)return;const unanswered=current&&!state.votes[current];applyServerState(data);$('header-balance').textContent=fmt(balance())+' P';if(view==='feed'&&unanswered&&state.votes[current]){nextQuestion();render();}else if(view==='wallet')renderWallet();updateBoostUI();}
 catch{}
}
document.addEventListener('visibilitychange',()=>{updateBoostUI();if(!document.hidden)refreshServerState();});
window.addEventListener('focus',refreshServerState);
if(SERVER)setInterval(refreshServerState,15000);
</script>
</body>
